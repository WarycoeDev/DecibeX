name: decibex
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  media_metadata: ^2.2.2

  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  audio_service: ^0.18.19
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  ffmpeg_kit_flutter_new: ^4.6.7
  youtube_explode_dart: ^3.1.0
  extractor: ^1.0.0
  universal_youtube_player: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quicksand/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/quicksand/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/quicksand/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/quicksand/Quicksand-Bold.ttf
          weight: 700
